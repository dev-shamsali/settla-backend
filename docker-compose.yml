# Local development. MongoDB runs as a single-node replica set; Redis backs BullMQ.
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try{rs.status().ok}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok}\""]
      interval: 10s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, retries: 5 }
  backend:
    build: .
    env_file: .env.docker
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
  otel-collector:
    image: otel/opentelemetry-collector:0.104.0
    profiles: ["observability"]
    ports: ["4318:4318"]
volumes:
  mongo-data:
  redis-data:
